[window]
decorations = "None"
opacity = 1.0
dynamic_title = true
decorations_theme_variant = "Dark"

[font]
normal = { family = "Hack Nerd Font", style = "Medium" }
bold = { family = "Hack Nerd Font", style = "Bold" }
italic = { family = "Hack Nerd Font", style = "Italic" }
size = 13

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

[env]
TERM = "xterm-256color"

[colors.cursor]
text = "#0a0a0f"
cursor = "#ffffff"

# Normal colors 
[colors.normal]
black   = "#141414"
red     = "#e05555"
green   = "#3ecf8e"
yellow  = "#d4b24c"
blue    = "#4c88e0"
magenta = "#d16ad6"
cyan    = "#3fbac2"
white   = "#c8c8c8"

# Bright colors 
[colors.bright]
black   = "#4a4a4a"
red     = "#f06a6a"
green   = "#50e39c"
yellow  = "#e6c15c"
blue    = "#5c9cff"
magenta = "#e07be0"
cyan    = "#50cfd8"
white   = "#eaeaea"
