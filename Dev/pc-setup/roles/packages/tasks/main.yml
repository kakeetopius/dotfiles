---
- name: Include OS specific variables
  ansible.builtin.include_vars:
    file: '{{ansible_facts["os_family"]}}.yml'

- name: Installing core dev packages
  become: true
  ansible.builtin.package:
    name: "{{ packages }}"
    state: present

- name: Installing lazygit
  ansible.builtin.command:
    cmd: "{{ go_path }} install github.com/jesseduffield/lazygit@latest"

- name: Downloading starship installer
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship_install.sh
    mode: "0755"

- name: Installing starship
  become: true
  ansible.builtin.command:
    cmd: /tmp/starship_install.sh -y

- name: Setting up Neovim Config folder.
  ansible.builtin.file:
    path: "{{ config_dir }}/nvim"
    state: directory

- name: Cloning neovim configuration
  ansible.builtin.git:
    repo: "https://github.com/kakeetopius/nvim-setup"
    dest: "{{ config_dir }}/nvim"
  ignore_errors: true

- name: Installing eza
  ansible.builtin.command:
    cmd: "{{ cargo_path }} install eza"
  when: ansible_facts["os_family"] == "Debian"

- name: Setting Up tmux plugin folder
  ansible.builtin.file:
    path: "{{ tpm_path }}"
    state: directory

- name: Installing tmux plugin manager (tpm)
  ansible.builtin.git:
    repo: "https://github.com/tmux-plugins/tpm"
    dest: "{{ tpm_path }}"
    force: true
  ignore_errors: true
